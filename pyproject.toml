[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "test-driven-python-function-repair-assistant"
version = "0.1.0"
description = "A controlled test-feedback experiment for repairing small Python functions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["python-dotenv>=1.2,<2"]

[project.optional-dependencies]
dev = ["mypy>=1.14,<2", "pytest>=8.3,<9", "ruff>=0.9,<1"]

[project.scripts]
repair-agent = "repair_assistant.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/repair_assistant"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = ["sandbox: requires a local Docker daemon and sandbox image"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
